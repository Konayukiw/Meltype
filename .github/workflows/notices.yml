# ソースファイルの先頭のライセンス・著作権の表記を確かめる bot (.github/bot/notices.mjs)。
#   新しく足したソースファイルに SPDX と Copyright の行があるか、作者以外が Yukishiro 名義で書いていないかを見て、
#   見つけたら Pull Request にコメントする。
# pull_request_target は書き込みの権限を持つので、Pull Request のコードはチェックアウトしない
# (main の bot のスクリプトだけを使い、Pull Request の変更は GitHub の API で文字列として読む)。
name: notices

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/bot
          persist-credentials: false
      - run: node .github/bot/notices.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
